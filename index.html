<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#111827">
<title>WEAN Concert · Check-in vé</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f3f5f9;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh}
button,input{font:inherit}.shell{max-width:880px;margin:0 auto;padding:24px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.brand{font-weight:850;letter-spacing:.02em;font-size:18px}.brand span{color:#6366f1}
.userbar{font-size:13px;color:#64748b;display:flex;align-items:center;gap:10px}
.panel{background:#fff;border:1px solid #e7eaf0;border-radius:20px;padding:clamp(20px,4vw,34px);box-shadow:0 10px 35px #1018280a}
h1{font-size:clamp(25px,5vw,34px);margin:0 0 8px;letter-spacing:-.04em}
.sub{margin:0;color:#64748b;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat{background:#f8fafc;border:1px solid #edf0f5;border-radius:14px;padding:15px}
.stat b{display:block;font-size:25px;letter-spacing:-.04em}.stat span{font-size:12px;color:#64748b}
label{display:block;font-size:14px;font-weight:700;margin:22px 0 9px}
.searchrow{display:flex;gap:10px; position: relative;}
.input-wrapper {position: relative; flex: 1; min-width: 0;}
input{width:100%;min-width:0;padding:15px 16px;border:1px solid #d8dee9;border-radius:12px;outline:none;background:#fff;color:#111827; font-size: 16px;}
input:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11c}

/* CSS cho Auto-suggest */
.suggestions-list {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: white; border: 1px solid #e7eaf0; border-radius: 12px;
  list-style: none; padding: 4px 0; margin: 0; max-height: 240px; overflow-y: auto;
  z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none;
}
.suggestions-list.show { display: block; }
.suggestions-list li {
  padding: 12px 16px; cursor: pointer; font-size: 15px; color: #334155;
  border-bottom: 1px solid #f1f5f9; transition: background 0.15s;
}
.suggestions-list li:last-child { border-bottom: none; }
.suggestions-list li:hover, .suggestions-list li:active { background: #f8fafc; color: #4f46e5; font-weight: 600; }

button{border:0;border-radius:12px;padding:14px 22px;font-weight:750;cursor:pointer;transition:.15s; font-size: 15px;}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#4f46e5;color:white;white-space:nowrap; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);}
.primary:hover{background:#4338ca}
.primary:active{transform: scale(0.98);}
.secondary{background:#eef2ff;color:#4338ca}
.quiet{background:#f1f5f9;color:#475569;padding:9px 12px;font-size:12px}
.hint{font-size:12px;color:#94a3b8;margin:8px 0 0}
#result{margin-top:22px;display:none;border-radius:16px;padding:20px;border:1px solid transparent}
#result.show{display:block; animation: fadeIn 0.3s ease;}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.result-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.result-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900; font-size: 18px;}
.result-title{font-weight:850;font-size:19px}.result-desc{font-size:14px;opacity:.8;margin-top:4px}
.success{background:#ecfdf3;border-color:#abefc6;color:#067647}.success .result-icon{background:#d1fadf}
.warning{background:#fffaeb;border-color:#fedf89;color:#b54708}.warning .result-icon{background:#fef0c7}
.danger{background:#fef3f2;border-color:#fecdca;color:#b42318}.danger .result-icon{background:#fee4e2}

/* Layout thông tin người dùng thu gọn */
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.detail{background:#ffffffa8;border:1px solid #0000000a;border-radius:11px;padding:16px;min-width:0;}
.detail small{display:block;text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:800;opacity:.65;margin-bottom:6px}
.detail strong{overflow-wrap:anywhere;font-size:16px;}
.ticket-highlight strong { color: #4f46e5; }
.note{margin-top:12px;padding:14px;border-radius:11px;background:#fff5f5; border: 1px dashed #fecaca; color: #b91c1c; font-size:14px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere}
.note b { color: #991b1b; display: block; margin-bottom: 4px;}

.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1; padding: 18px; font-size: 16px;}
.hidden{display:none!important}
.footer{text-align:center;color:#94a3b8;font-size:13px;margin-top:28px}

/* Tối ưu UI cho Mobile */
@media(max-width:560px){
  .shell{padding:12px 10px 30px}
  .panel{border-radius:16px; padding: 20px 16px;}
  .stats{gap:8px; margin: 16px 0;}
  .stat{padding:12px 8px; border-radius: 12px;}
  .stat b{font-size:22px}
  .stat span{font-size:11px}
  .searchrow{flex-direction:column}
  .searchrow button{width:100%; padding: 16px;}
  input {padding: 16px;}
  .details{grid-template-columns:1fr} 
  .detail {padding: 14px;}
  .result-head { align-items: flex-start; }
  .result-title {font-size: 18px;}
  .result-icon { min-width: 42px; }
  .actions{flex-direction:column}
}
</style>
</head>
<body>
<main id="app" class="shell">
  <header class="top">
    <div class="brand">WEAN <span>· CHECK-IN</span></div>
  </header>
  <section class="panel">
    <h1>Check-in nhận vé</h1>
    <p class="sub">Nhập email đăng ký để kiểm tra thông tin và xác nhận phát vé.</p>
    <div class="stats">
      <div class="stat"><b id="totalPeople">—</b><span>Người đăng ký</span></div>
      <div class="stat"><b id="totalTickets">—</b><span>Tổng số vé</span></div>
      <div class="stat"><b id="checkedPeople">—</b><span>Đã check-in</span></div>
    </div>
    <form id="searchForm">
      <label for="emailInput">Email đăng ký</label>
      <div class="searchrow">
        <div class="input-wrapper">
          <input id="emailInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Nhập tên hoặc email (vd: hieu)">
          <ul id="suggestionsList" class="suggestions-list"></ul>
        </div>
        <button class="primary" id="searchBtn" type="submit">Kiểm tra</button>
      </div>
      <p class="hint">Nhập từ 2 ký tự để gợi ý. Hệ thống tự thêm @gmail.com nếu chỉ nhập tên.</p>
    </form>
    <div id="result" role="status" aria-live="polite"></div>
  </section>
  <div class="footer">Trạng thái check-in được đồng bộ Realtime giữa các thiết bị.</div>
</main>
<script>
/* CẤU HÌNH: thay 2 giá trị bên dưới bằng thông tin trong Supabase > Project Settings > API */
const SUPABASE_URL = "https://bahwtchwhqjdnglmvctc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2LBPBfwyPSqWH8YVCh3B1g_85V43xGR";

let db = null, currentEmail = null, currentUser = null, realtimeChannel = null;
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function showApp(){ $("app").classList.remove("hidden"); refreshStats(); subscribeRealtime(); }

/* UI KẾT QUẢ ĐÃ ĐƯỢC THU GỌN THEO YÊU CẦU */
function showResult(kind,title,desc,record=null,buttonMode=""){
  const box=$("result"); box.className="show "+kind;
  let details="";
  if(record){
    // Lược bỏ dòng email và dòng trạng thái. Chỉ hiển thị Tên và Số vé.
    details=`<div class="details">
      <div class="detail"><small>Họ và tên người nhận</small><strong>${escapeHtml(record.full_name || "—")}</strong></div>
      <div class="detail ticket-highlight"><small>Số lượng vé cần phát</small><strong style="font-size:24px">${Number(record.ticket_count)} vé</strong></div>
    </div>${record.note ? `<div class="note"><b>LƯU Ý QUAN TRỌNG (NOTE):</b>${escapeHtml(record.note)}</div>` : ""}`;
  }
  let action="";
  if(buttonMode==="checkin") action=`<div class="actions"><button class="primary" id="confirmCheckin">XÁC NHẬN PHÁT ${Number(record.ticket_count)} VÉ</button></div>`;
  if(buttonMode==="checked") action=`<div class="actions"><button class="secondary" disabled>ĐÃ XÁC NHẬN · KHÔNG PHÁT LẠI</button></div>`;
  
  box.innerHTML=`<div class="result-head"><div class="result-icon">${kind==="success"?"✓":kind==="warning"?"!":"×"}</div><div><div class="result-title">${escapeHtml(title)}</div><div class="result-desc">${escapeHtml(desc)}</div></div></div>${details}${action}`;
  if(buttonMode==="checkin") $("confirmCheckin").addEventListener("click",doCheckin);
}

function normalizeEmail(raw){
  let email=raw.trim().toLowerCase();
  if(email && !email.includes("@")) email += "@gmail.com";
  return email;
}

async function refreshStats(){
  const {data,error}=await db.rpc("get_checkin_stats");
  if(error){console.error(error);return;}
  $("totalPeople").textContent=data.total_people;
  $("totalTickets").textContent=data.total_tickets;
  $("checkedPeople").textContent=data.checked_in_people;
}

/* LOGIC AUTO-SUGGEST EMAIL */
let suggestionTimeout = null;
$("emailInput").addEventListener("input", (e) => {
  const query = e.target.value.trim().toLowerCase();
  const list = $("suggestionsList");
  
  clearTimeout(suggestionTimeout);
  
  if (query.length < 2) {
    list.classList.remove("show");
    return;
  }
  
  suggestionTimeout = setTimeout(async () => {
    // Tìm email chứa chuỗi truy vấn (ilike), giới hạn 7 kết quả
    const { data, error } = await db.from("attendees").select("email").ilike("email", `%${query}%`).limit(7);
    
    if (error || !data || data.length === 0) {
      list.classList.remove("show");
      return;
    }
    
    list.innerHTML = "";
    data.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item.email;
      li.addEventListener("click", () => {
        $("emailInput").value = item.email;
        list.classList.remove("show");
        // Tự động submit sau khi chọn
        $("searchBtn").click(); 
      });
      list.appendChild(li);
    });
    list.classList.add("show");
  }, 300); // 300ms debounce
});

// Ẩn dropdown khi click ra ngoài
document.addEventListener("click", (e) => {
  if (!e.target.closest('.input-wrapper')) {
    $("suggestionsList").classList.remove("show");
  }
});


async function lookupEmail(email){
  currentEmail=email;
  const {data,error}=await db.from("attendees").select("id,email,full_name,ticket_count,note,checked_in,checked_in_at").eq("email",email).maybeSingle();
  if(error){showResult("danger","Không thể tra cứu","Vui lòng thử lại hoặc báo quản trị viên.");console.error(error);return;}
  if(!data){showResult("danger","Không tìm thấy khách hàng","Email này không nằm trong danh sách đăng ký: "+email);return;}
  
  if(data.checked_in){
    const when=data.checked_in_at ? new Date(data.checked_in_at).toLocaleString("vi-VN") : "";
    showResult("warning","Khách ĐÃ check-in","Khách đã được xác nhận nhận vé trước đó"+(when?" lúc "+when:"")+".");
  } else {
    showResult("success","Khách HỢP LỆ · Sẵn sàng phát vé","Vui lòng đối chiếu họ tên và đưa đúng số lượng vé.",data,"checkin");
  }
}

async function doCheckin(){
  const btn=$("confirmCheckin"); if(!currentEmail || !btn) return;
  btn.disabled=true; btn.textContent="ĐANG XỬ LÝ...";
  const {data,error}=await db.rpc("check_in_by_email",{p_email:currentEmail});
  if(error){btn.disabled=false;btn.textContent="THỬ LẠI";showResult("danger","Lỗi hệ thống","Vui lòng thử lại: "+error.message);return;}
  
  await refreshStats();
  if(data.status==="checked_in"){
    showResult("success","ĐÃ GHI NHẬN THÀNH CÔNG","Hệ thống đã lưu trạng thái phát "+data.ticket_count+" vé.",data,"checked");
  }else if(data.status==="already_checked_in"){
    showResult("warning","Bị trùng lặp","Khách đã được người khác check-in ngay trước đó.",data,"checked");
  }else{
    showResult("danger","Lỗi","Không tìm thấy email.");
  }
}

$("searchForm").addEventListener("submit",async e=>{
  e.preventDefault(); 
  $("suggestionsList").classList.remove("show");
  const email=normalizeEmail($("emailInput").value);
  $("result").className="";
  if(!email){showResult("danger","Chưa nhập thông tin","Vui lòng nhập email.");return;}
  const valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!valid){showResult("danger","Email sai định dạng","Vui lòng kiểm tra lại.");return;}
  
  $("searchBtn").disabled=true;$("searchBtn").textContent="ĐANG TÌM...";
  await lookupEmail(email);
  $("searchBtn").disabled=false;$("searchBtn").textContent="Kiểm tra";
});

function subscribeRealtime(){
  if(realtimeChannel) db.removeChannel(realtimeChannel);
  realtimeChannel=db.channel("checkin-live").on("postgres_changes",{event:"*",schema:"public",table:"attendees"},async payload=>{
    await refreshStats();
    if(currentEmail && payload.new && payload.new.email===currentEmail) await lookupEmail(currentEmail);
  }).subscribe();
}

async function init(){
  if(SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_")){
    showResult("danger","Chưa cấu hình Supabase","Quản trị viên cần cập nhật SUPABASE_URL và SUPABASE_ANON_KEY trong HTML.");
    return;
  }
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  showApp();
}
init();
</script>
</body>
</html>
